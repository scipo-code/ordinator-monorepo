name: Rust Test

on:
  pull_request:
    branches: [main]

env:
  ORDINATOR_LOG_DIR: '/tmp'

jobs:
  backend_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: complete
          toolchain: nightly
          override: true
      - name: Run tests
        run: |
          cp .env.example .env
          cargo test --workspace --verbose 

  frontend_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: complete
          toolchain: nightly
          override: true
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install frontend dependencies
        run: cd static_files/packages/shared/ && pnpm install
      - name: Wait for server to be ready
        run: |
          cp .env.example .env && cargo test --test master_system_test_0400_work_orders_03_technicians -- --ignored --nocapture &
          while [ ! -f $ORDINATOR_LOG_DIR/ordinator/ordinator.research.log ] || ! grep "READY" $ORDINATOR_LOG_DIR/ordinator/ordinator.research.log; do sleep 2;  done
      - name: Run frontend tests
        run: cd static_files/packages/shared/ && pnpm test:run
      - name: Stop backend server
        run: pkill -f test_complete_system || true 

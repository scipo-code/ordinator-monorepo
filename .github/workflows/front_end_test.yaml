name: Front End Test

on:
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: complete
          toolchain: nightly
          override: true
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install frontend dependencies
        run: cd static_files/packages/shared/ && pnpm install
      - name: Start backend server
        run: cp .env.example .env && cargo test test_complete_system -- --ignored --nocapture &
        env:
          BACKGROUND: true
      - name: Wait for server to be ready
        run: sleep 10
      - name: Run frontend tests
        run: cd static_files/packages/shared/ && pnpm test:run
      - name: Stop backend server
        run: pkill -f test_complete_system || true 


